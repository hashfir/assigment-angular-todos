<div class="column">

  <!-- Column Header -->
  <div class="column-header" [style.--col-color]="column().color">
    <div class="header-left">
      <span class="col-dot"></span>
      <h3 class="col-title">{{ column().title }}</h3>
    </div>
    <span class="task-count">{{ column().tasks.length }}</span>
  </div>

  <!-- Task List -->
  <div class="task-list">
    @for (task of column().tasks; track task.id) {
      <app-task-card
        [task]="task"
        [column]="column()"
        [prevColumnId]="prevColumnId()"
        [nextColumnId]="nextColumnId()"
      />
    }

    @if (column().tasks.length === 0) {
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>No tasks here yet</p>
        <span>Click below to add one</span>
      </div>
    }
  </div>

  <!-- Add Task -->
  @if (showAddForm()) {
    <div class="add-form">
      <input
        class="form-input"
        [class.input-error]="titleTouched() && !newTitle.trim()"
        type="text"
        placeholder="What needs to be done?"
        maxlength="200"
        [(ngModel)]="newTitle"
        (ngModelChange)="titleTouched.set(false)"
        (keydown.enter)="addTask()"
        (keydown.escape)="cancelAdd()"
        appAutofocus
      />
      @if (titleTouched() && !newTitle.trim()) {
        <span class="field-error">Task name is required.</span>
      }
      <textarea
        class="form-textarea"
        placeholder="Add a description... (optional)"
        maxlength="1000"
        [(ngModel)]="newDescription"
        rows="2"
      ></textarea>
      <div class="form-priority">
        <label class="priority-label">Priority</label>
        <div class="priority-options">
          <label class="priority-opt" [class.selected]="newPriority === 'low'">
            <input type="radio" name="priority-{{ column().id }}" value="low" [(ngModel)]="newPriority" />
            <span class="dot dot-low"></span> Low
          </label>
          <label class="priority-opt" [class.selected]="newPriority === 'medium'">
            <input type="radio" name="priority-{{ column().id }}" value="medium" [(ngModel)]="newPriority" />
            <span class="dot dot-medium"></span> Medium
          </label>
          <label class="priority-opt" [class.selected]="newPriority === 'high'">
            <input type="radio" name="priority-{{ column().id }}" value="high" [(ngModel)]="newPriority" />
            <span class="dot dot-high"></span> High
          </label>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-submit" (click)="addTask()">Add Task</button>
        <button class="btn-dismiss" (click)="cancelAdd()" title="Cancel">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>
          </svg>
        </button>
      </div>
    </div>
  } @else {
    <button class="add-card-btn" (click)="showAddForm.set(true)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/>
      </svg>
      Add a card
    </button>
  }

</div>
