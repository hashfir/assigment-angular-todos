<div class="card" [attr.data-priority]="task().priority">

  @if (!isEditing()) {
    <div class="card-view">
      <span class="priority-badge priority-{{ task().priority }}">{{ priorityLabel }}</span>

      <p class="card-title">{{ task().title }}</p>

      @if (task().description) {
        <p class="card-description">{{ task().description }}</p>
      }

      <div class="card-actions">
        <div class="move-btns">
          @if (prevColumnId()) {
            <button class="btn-icon btn-move" (click)="moveLeft()" title="Move to previous column">
              &#8249;
            </button>
          }
          @if (nextColumnId()) {
            <button class="btn-icon btn-move" (click)="moveRight()" title="Move to next column">
              &#8250;
            </button>
          }
        </div>
        <div class="right-btns">
          <button class="btn-icon btn-edit" (click)="startEdit()" title="Edit task">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
              <path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Z"/>
            </svg>
          </button>
          <button class="btn-icon btn-delete" (click)="delete()" title="Delete task">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
              <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  } @else {
    <div class="card-edit">
      <input
        class="edit-input"
        [class.input-error]="editTitleTouched() && !editTitle.trim()"
        type="text"
        [(ngModel)]="editTitle"
        placeholder="Task title..."
        maxlength="200"
        (ngModelChange)="editTitleTouched.set(false)"
        (keydown.enter)="saveEdit()"
        (keydown.escape)="cancelEdit()"
        appAutofocus
      />
      @if (editTitleTouched() && !editTitle.trim()) {
        <span class="field-error">Task name is required.</span>
      }
      <textarea
        class="edit-textarea"
        [(ngModel)]="editDescription"
        rows="2"
        maxlength="1000"
        placeholder="Description (optional)"
      ></textarea>
      <select class="edit-select" [(ngModel)]="editPriority">
        <option value="low">Low priority</option>
        <option value="medium">Medium priority</option>
        <option value="high">High priority</option>
      </select>
      <div class="edit-actions">
        <button class="btn-save" (click)="saveEdit()">Save</button>
        <button class="btn-cancel-edit" (click)="cancelEdit()">Cancel</button>
      </div>
    </div>
  }

</div>
