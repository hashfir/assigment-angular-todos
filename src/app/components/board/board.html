<div class="board-wrap">
  <div class="board" cdkDropListGroup>
    @for (column of columns(); track column.id; let i = $index) {
      <app-column
        [column]="column"
        [prevColumnId]="i > 0 ? columns()[i - 1].id : null"
        [nextColumnId]="i < columns().length - 1 ? columns()[i + 1].id : null"
      />
    }
  </div>
</div>
